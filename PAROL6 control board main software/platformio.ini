[env:mellow_fly_super8]
platform = ststm32
board = nucleo_h723zg
framework = arduino

extra_scripts = pre_build.py

build_flags =
    -D USB_VID=0x0483
    -D USB_PID=0x5740
    -D USB_MANUFACTURER="Mellow"
    -D USB_PRODUCT="PAROL6 Robot"
    -D ARDUINO_GENERIC_H723ZGTX
    -D USBCON
    -D STM32H723xx
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PC_3_C=PC3
    -D PC_2_C=PC2
    -Wno-builtin-macro-redefined
    -Wl,--allow-multiple-definition

upload_protocol = stlink
upload_port = /dev/ttyACM0
upload_speed = 921600

lib_deps = 
    teemuatlut/TMCStepper@^0.7.3
    waspinator/AccelStepper @ ^1.64.0

monitor_port = ${env.upload_port}
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0